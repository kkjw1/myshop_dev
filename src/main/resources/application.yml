spring:
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}     # Gemini Developer API (무료 키)
        chat:
          model: gemini-3.5-flash-lite
          temperature: 0.2             # 도구 호출 위주라 낮게
          max-output-tokens: 1024      # 옵션 키 이름은 스타터 버전별로 다를 수 있음 → IDE 자동완성으로 확인
        embedding:                     # 리뷰 RAG 임베딩 (채팅과 연결 설정이 별도라 api-key를 따로 지정)
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-001
  retry:
    on-http-codes: 429, 503            # 무료 한도 초과/과부하 시 재시도

  mail:
    host: smtp.gmail.com          # 구글 SMTP 서버 주소
    port: 587                     # 구글 SMTP 포트 번호
    username: ${GOOGLE_MAIL_ADDRESS}  # 사용자 이메일
    password: ${GOOGLE_MAIL_PASSWORD} # 사용자 앱 비밀번호
    properties:
      mail:
        smtp:
          auth: true              # 사용자 인증 여부
          timeout: 5000           # 이메일 전송 타임아웃 시간
          starttls:
            enable: true          # TLS를 통해 안전한 통신 사용 여부

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

  config:
    import: optional:file:.env[.properties]

  messages:
    basename: messages,errors

  profiles:
    active: local

  datasource:
    url: jdbc:h2:tcp://localhost/~/myshop
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        # show_sql: true
        format_sql: true
#        use_sql_comments: true

logging.level:
  org.hibernate.SQL: debug
#  org.hibernate.type: trace

server:
  servlet:
    session:
      timeout: 6000   #세션 타임아웃 설정(기본:초)
      tracking-modes: cookie  #첫 로그인할 경우 jsessionid 404오류 해결


solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender: ${SOLAPI_SENDER}

file:
  path: ${FILE_STORE_PATH}
  exteral-path: ${FILE_EXTERNAL_STORE_PATH}

redis:
  ttl:
    timeout: 20   #단위:초

jwt:
  secret: ${JWT_SECRET}